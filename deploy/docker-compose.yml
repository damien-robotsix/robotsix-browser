# Central-deploy contract for robotsix-browser.
#
# Contract version: 1
#
# robotsix-central-deploy consumes this file to register and manage the
# service. The `labels` block is the machine-readable contract: it declares
# how central-deploy should run the service (deploy mode, the port it
# listens on, and its health-check path). central-deploy builds the image
# and manages health-checking centrally, so this file references the
# published GHCR image and omits the build and healthcheck sections.
#
# Keep this in sync with the Dockerfile (EXPOSE) and __main__.py (bind
# host/port). The service listens on 8000 and exposes GET /health.

services:
  robotsix-browser:
    image: ghcr.io/damien-robotsix/robotsix-browser:main
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ROBOTSIX_BROWSER_HOST: "0.0.0.0"
      ROBOTSIX_BROWSER_PORT: "8000"
    labels:
      # Deploy contract consumed by robotsix-central-deploy.
      robotsix.deploy.mode: "service"
      robotsix.deploy.port: "8000"
      robotsix.deploy.health: "/health"
