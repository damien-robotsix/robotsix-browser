[project]
name = "robotsix-browser"
version = "0.2.0"
description = "Interactive headless-browser / form-filling HTTP service for the robotsix fleet."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "robotsix" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.9",
    "cryptography>=44",
    "structlog>=24.4",
    "robotsix-config>=0.1",
    "robotsix-http>=0.1",
    "robotsix-llmio>=0.1",
]

[tool.uv]
# robotsix-llmio transitively pins an older robotsix-http rev via its own
# [tool.uv.sources]; browser runs on the newer a77b6b1 main commit (which
# adds the shared create_health_router probe stack on top of the shared
# robotsix_http.fastapi correlation-id middleware). Override so the whole tree
# resolves to browser's newer pin instead of downgrading it.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@a77b6b11e2e24f23421051e4388a9130eb2b93c5",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "d29de204db62910f062456e5055fc2fe232e04a9" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "a77b6b11e2e24f23421051e4388a9130eb2b93c5" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio", rev = "97b69c33b0c836b9f288ab5c69b913876b1229d7" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules", tag = "v0.5.3" }

[project.scripts]
robotsix-browser = "robotsix_browser.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "deptry>=0.20",
    "vulture>=2.13",
    "mypy-baseline>=0.7",
    "robotsix-modules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_browser"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# The chat-skill module embeds a markdown document whose example request/
# response lines are naturally longer than the code line limit.
"src/robotsix_browser/chat_skill.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the `scripts` package
# (e.g. the Dockerfile / workflow linters invoked directly in CI).
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["robotsix_browser"]

[tool.vulture]
# FastAPI route handlers and pydantic model fields look "unused" to static
# analysis (they are invoked/populated by the framework).  Keep the high
# confidence signal (unused imports/variables) and drop the 60% framework noise.
min_confidence = 80

[tool.deptry]
known_first_party = ["robotsix_browser", "scripts"]

[tool.deptry.per_rule_ignores]
# Tooling invoked via CLI, never imported.
DEP002 = ["ruff", "mypy", "deptry", "vulture", "mypy-baseline", "pytest-asyncio"]
