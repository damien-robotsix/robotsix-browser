[project]
name = "robotsix-browser"
version = "0.1.0"
description = "Interactive headless-browser / form-filling HTTP service for the robotsix fleet."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "robotsix" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.9",
    "cryptography>=44",
    "structlog>=24.4",
    "robotsix-config>=0.1",
    "robotsix-http>=0.1",
    "robotsix-llmio>=0.1",
]

[tool.uv]
# robotsix-llmio transitively pins an older robotsix-http rev via its own
# [tool.uv.sources]; browser runs on the newer be2dcd5 main commit (the
# squash-merge of PR #130, which adds the shared robotsix_http.fastapi
# correlation-id middleware). Override so the whole tree resolves to browser's
# newer pin instead of downgrading it.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@be2dcd5e58addaf6684ceb67450436c13aae6619",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "fa2a36cfabf7a420fb2168aca3c0ceecbb1c7667" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "861dfbaf3a1af8e992e3ae7c8389304a3c015a25" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio", rev = "32215e4512942e01746083444f5bcae906b34206" }

[project.scripts]
robotsix-browser = "robotsix_browser.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "deptry>=0.20",
    "vulture>=2.13",
    "mypy-baseline>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_browser"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# The chat-skill module embeds a markdown document whose example request/
# response lines are naturally longer than the code line limit.
"src/robotsix_browser/chat_skill.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["robotsix_browser"]

[tool.vulture]
# FastAPI route handlers and pydantic model fields look "unused" to static
# analysis (they are invoked/populated by the framework).  Keep the high
# confidence signal (unused imports/variables) and drop the 60% framework noise.
min_confidence = 80

[tool.deptry]
known_first_party = ["robotsix_browser", "scripts", "_workflow_lint"]

[tool.deptry.per_rule_ignores]
# Tooling invoked via CLI, never imported.
DEP002 = ["ruff", "mypy", "deptry", "vulture", "mypy-baseline", "pytest-asyncio"]
# Standalone CI lint scripts import PyYAML inside a try/except with a runtime
# pip-install fallback, so it is deliberately not a declared project dependency.
DEP001 = ["yaml"]
