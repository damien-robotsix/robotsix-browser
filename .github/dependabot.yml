version: 2
updates:
  # Python dependencies (uv lockfile).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions SHAs pinned in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base-image digests in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
