name: Dependabot auto-merge

on:
  pull_request:

permissions: {} # no workflow-level default; the job grants its own

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # approve and merge the PR
      pull-requests: write # label and merge the PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependabot-auto-merge.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
