name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Dependency hygiene
        run: uv run deptry .

      - name: Dead code
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py

      - name: Module registration
        run: uv run robotsix-modules check-registration docs/modules.yaml --root .

      - name: Config schema sync
        run: |
          uv run python -c "
          from robotsix_browser.config import Settings
          from robotsix_config import config_schema_json
          expected = config_schema_json(Settings)
          with open('config/config.schema.json') as f:
              actual = f.read()
          if actual != expected:
              print('config/config.schema.json is out of date.')
              print('Run: uv run python -c \"from robotsix_browser.config import Settings; from robotsix_config import config_schema_json; open(\\\"config/config.schema.json\\\",\\\"w\\\").write(config_schema_json(Settings))\"')
              raise SystemExit(1)
          "

      - name: Tests
        run: uv run pytest

  # PR-time image gate: build the Dockerfile (plus the fleet hardening layer)
  # without pushing, smoke-test it and fail on CRITICAL/HIGH fixable CVEs, so a
  # broken Dockerfile or a new base-image CVE is caught before merge.
  docker-pr-scan:
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@05d872b062890597dfcdd83d0eeac8918edc3618  # v1.3.0
    with:
      # The image CMD starts the uvicorn server (it has no --help), so smoke
      # the image by importing the app from its venv instead.
      smoke_command: /app/.venv/bin/python -c "import robotsix_browser.app"
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning

  # Build and publish the deployable container image (with the Playwright /
  # Chromium runtime baked in by the Dockerfile) to GHCR via the shared
  # docker-release workflow (build, hardening layer, push, Trivy gate + SARIF,
  # provenance/SBOM attestation). central-deploy pulls
  # `ghcr.io/damien-robotsix/robotsix-browser:main` (see deploy/docker-compose.yml);
  # docker-release publishes `:main` (type=ref,event=branch) and
  # `:sha-<short-sha>` (type=sha). Runs only after the test job passes and
  # never on pull requests.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@05d872b062890597dfcdd83d0eeac8918edc3618  # v1.3.0
    with:
      smoke_command: /app/.venv/bin/python -c "import robotsix_browser.app"
    permissions:
      contents: read
      packages: write         # push the image to GHCR
      id-token: write         # provenance/SBOM attestation signing
      attestations: write     # provenance/SBOM attestation signing
      security-events: write  # Trivy SARIF upload to Code Scanning

  # Shared security gate: SAST + dependency CVE audit + secret scan + SBOM.
  # (fleet-wide reusable workflow — the SAST realization of the baseline's
  # "Semgrep (SAST)" security item.)
  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@c0be17843fda25e199897042e4b2e06f5127e3b4  # main
    with:
      # This project defines no optional-dependency extras; override the
      # reusable workflow's default `install-extras: tracing` so `uv sync`
      # does not fail on an undefined extra.
      install-extras: ""
    permissions:
      contents: read

  # Shared workflow-audit gate: actionlint + zizmor audit of workflow files.
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@6c5841305cc9bdd04f13deb2f05462d041e877be  # v1.2.0
    with:
      run-actionlint: true
      run-zizmor: true
      dockerfiles: Dockerfile
    permissions:
      contents: read
