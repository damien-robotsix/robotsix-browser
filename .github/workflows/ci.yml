name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Dependency hygiene
        run: uv run deptry .

      - name: Dead code
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py

      - name: Config schema sync
        run: |
          uv run python -c "
          from robotsix_browser.config import Settings
          from robotsix_config import config_schema_json
          expected = config_schema_json(Settings)
          with open('config/config.schema.json') as f:
              actual = f.read()
          if actual != expected:
              print('config/config.schema.json is out of date.')
              print('Run: uv run python -c \"from robotsix_browser.config import Settings; from robotsix_config import config_schema_json; open(\\\"config/config.schema.json\\\",\\\"w\\\").write(config_schema_json(Settings))\"')
              raise SystemExit(1)
          "

      - name: Tests
        run: uv run pytest

  # Build and publish the deployable container image (with the Playwright /
  # Chromium runtime baked in by the Dockerfile) to GHCR. central-deploy pulls
  # `ghcr.io/damien-robotsix/robotsix-browser:main` (see deploy/docker-compose.yml),
  # so this job produces that pullable tag on every push to main. Runs only
  # after the test job passes and never on pull requests.
  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the built image to GHCR (ghcr.io/damien-robotsix/robotsix-browser)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/damien-robotsix/robotsix-browser:main \
            -t "ghcr.io/damien-robotsix/robotsix-browser:sha-${GITHUB_SHA}" \
            .

      - name: Push image
        shell: bash
        run: |
          # GHCR intermittently fails a docker push mid-stream with "unknown
          # blob" (a registry-side blob-upload race). The image is already
          # built and tagged, so a bounded retry is cheap: blobs uploaded by
          # the failed attempt are reused ("Layer already exists").
          retry_push() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if docker push "$tag"; then
                echo "Pushed ${tag}"
                return 0
              fi
              echo "docker push ${tag} failed (attempt ${attempt}/5); retrying in 10s..."
              sleep 10
            done
            echo "docker push ${tag} failed after 5 attempts" >&2
            return 1
          }
          retry_push ghcr.io/damien-robotsix/robotsix-browser:main
          retry_push "ghcr.io/damien-robotsix/robotsix-browser:sha-${GITHUB_SHA}"

  # Shared security gate: SAST + dependency CVE audit + secret scan + SBOM.
  # (fleet-wide reusable workflow — the SAST realization of the baseline's
  # "Semgrep (SAST)" security item.)
  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@c0be17843fda25e199897042e4b2e06f5127e3b4  # main
    with:
      # This project defines no optional-dependency extras; override the
      # reusable workflow's default `install-extras: tracing` so `uv sync`
      # does not fail on an undefined extra.
      install-extras: ""
    permissions:
      contents: read

  # Shared workflow-audit gate: actionlint + zizmor audit of workflow files.
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@c0be17843fda25e199897042e4b2e06f5127e3b4  # main
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
