name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Python CI gate (lint, typecheck, deptry, vulture, bandit,
  # dependency audit, and pytest with a hard 80% coverage floor) via the
  # fleet reusable python-ci.yml. Replaces the previous hand-rolled inline
  # test job; the repo-specific bits (Playwright browser install, module
  # registration and config-schema drift checks) are passed back in through
  # the workflow's pre-test-command / extra-check-command hooks.
  test:
    name: Tests
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      # This project defines no optional-dependency extras; override the
      # reusable workflow's default `install-extras: tracing` so `uv sync
      # --frozen` does not fail on an undefined extra.
      install-extras: ""
      cov-package: robotsix_browser
      coverage-threshold: 80
      # The test suite drives a real Playwright Chromium; install it (with its
      # OS deps) after the editable install.
      pre-test-command: uv run playwright install --with-deps chromium
      # Repo-specific gates the shared workflow does not know about: module
      # registration and config-schema drift (config/config.schema.json must
      # match robotsix_browser.config.Settings).
      extra-check-command: |-
        uv run robotsix-modules check-registration docs/modules.yaml --root . &&
        uv run python -c "
        from robotsix_browser.config import Settings
        from robotsix_config import config_schema_json
        expected = config_schema_json(Settings)
        with open('config/config.schema.json') as f:
            actual = f.read()
        if actual != expected:
            print('config/config.schema.json is out of date.')
            print('Run: uv run python -c \"from robotsix_browser.config import Settings; from robotsix_config import config_schema_json; open(\\\"config/config.schema.json\\\",\\\"w\\\").write(config_schema_json(Settings))\"')
            raise SystemExit(1)
        "
      # Keep the dead-code gate from the old inline job (the shared workflow
      # ships it disabled by default). The --ignore-decorators drop keeps
      # pydantic field/model validators (invoked by the framework, never by
      # name) from being flagged as unused.
      run-vulture: true
      vulture-args: --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py
    permissions:
      contents: read

  # PR-time image gate: build the Dockerfile (plus the fleet hardening layer)
  # without pushing, smoke-test it and fail on CRITICAL/HIGH fixable CVEs, so a
  # broken Dockerfile or a new base-image CVE is caught before merge.
  docker-pr-scan:
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      # The image CMD starts the uvicorn server (it has no --help), so smoke
      # the image by importing the app from its venv instead.
      smoke_command: /app/.venv/bin/python -c "import robotsix_browser.app"
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning

  # Build and publish the deployable container image (with the Playwright /
  # Chromium runtime baked in by the Dockerfile) to GHCR via the shared
  # docker-release workflow (build, hardening layer, push, Trivy gate + SARIF,
  # provenance/SBOM attestation). central-deploy pulls
  # `ghcr.io/damien-robotsix/robotsix-browser:main` (see deploy/docker-compose.yml);
  # docker-release publishes `:main` (type=ref,event=branch) and
  # `:sha-<short-sha>` (type=sha). Runs only after the test job passes and
  # never on pull requests.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      smoke_command: /app/.venv/bin/python -c "import robotsix_browser.app"
    permissions:
      contents: read
      packages: write         # push the image to GHCR
      id-token: write         # provenance/SBOM attestation signing
      attestations: write     # provenance/SBOM attestation signing
      security-events: write  # Trivy SARIF upload to Code Scanning

  # Shared security gate: SAST + dependency CVE audit + secret scan + SBOM.
  # (fleet-wide reusable workflow — the SAST realization of the baseline's
  # "Semgrep (SAST)" security item.)
  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      # This project defines no optional-dependency extras; override the
      # reusable workflow's default `install-extras: tracing` so `uv sync`
      # does not fail on an undefined extra.
      install-extras: ""
    permissions:
      contents: read

  # Diff-scoped dependency review gate on pull requests, via the shared
  # robotsix-github-workflows dependency-review.yml reusable workflow. It
  # (a) blocks PRs that add dependencies with known CVEs rated moderate or
  # higher and (b) denies strong-copyleft licenses incompatible with this
  # project's MIT license.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      fail-on-severity: moderate
      deny-licenses: >-
        GPL-2.0-only, GPL-2.0-or-later,
        GPL-3.0-only, GPL-3.0-or-later,
        AGPL-3.0-only, AGPL-3.0-or-later,
        LGPL-2.1-only, LGPL-2.1-or-later,
        LGPL-3.0-only, LGPL-3.0-or-later
      comment-summary-in-pr: true
    permissions:
      contents: read
      pull-requests: write  # needed for comment-summary-in-pr

  # Shared Dockerfile lint gate: hadolint over every Dockerfile this repo
  # builds, failing on warning-level findings or worse. No .hadolint.yaml
  # exists, so hadolint's defaults apply; no SARIF upload.
  lint-dockerfile:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      dockerfiles: Dockerfile
      failure-threshold: warning
    permissions:
      contents: read

  # Shared workflow-audit gate: actionlint + zizmor audit of workflow files.
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      run-actionlint: true
      run-zizmor: true
      dockerfiles: Dockerfile
    permissions:
      contents: read
