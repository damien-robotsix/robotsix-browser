name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Dependency hygiene
        run: uv run deptry .

      - name: Dead code
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py

      - name: Tests
        run: uv run pytest

  # Shared security gate: SAST + dependency CVE audit + secret scan + SBOM.
  # (fleet-wide reusable workflow — the SAST realization of the baseline's
  # "Semgrep (SAST)" security item.)
  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@c0be17843fda25e199897042e4b2e06f5127e3b4  # main
    with:
      # This project defines no optional-dependency extras; override the
      # reusable workflow's default `install-extras: tracing` so `uv sync`
      # does not fail on an undefined extra.
      install-extras: ""
    permissions:
      contents: read

  # Shared workflow-audit gate: actionlint + zizmor audit of workflow files.
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@c0be17843fda25e199897042e4b2e06f5127e3b4  # main
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
