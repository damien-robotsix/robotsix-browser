# Canonical module-file manifest for robotsix-browser.
# Every source / test / changelog file is registered under a module below.
modules:
  - name: core
    description: Project configuration, packaging, CI, and changelog.
    paths:
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - LICENSE
      - README.md
      - .gitignore
      - .github/dependabot.yml
      - .github/workflows/ci.yml
      - config/config.schema.json
      - deploy/docker-compose.yml
      - docs/modules.yaml
      - vulture_whitelist.py
      - changelog.d/*.md

  - name: browser
    description: The interactive headless-browser HTTP service.
    paths:
      - src/robotsix_browser/__init__.py
      - src/robotsix_browser/__main__.py
      - src/robotsix_browser/app.py
      - src/robotsix_browser/bwcrypto.py
      - src/robotsix_browser/chat_skill.py
      - src/robotsix_browser/config.py
      - src/robotsix_browser/filehub.py
      - src/robotsix_browser/models.py
      - src/robotsix_browser/operations.py
      - src/robotsix_browser/sessions.py
      - src/robotsix_browser/vault.py

  - name: tests
    description: Test suite.
    paths:
      - tests/conftest.py
      - tests/test_api.py
      - tests/test_bwcrypto.py
      - tests/test_chat_skill.py
      - tests/test_filehub.py
      - tests/test_linkedin_fill_live.py
      - tests/test_models.py
      - tests/test_operations.py
      - tests/test_sessions.py
      - tests/test_vault.py
      - tests/vault_fixtures.py
